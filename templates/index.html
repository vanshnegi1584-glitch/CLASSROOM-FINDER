<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Classroom Finder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header { background: #2c3e50; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        header h1 { font-size: 1.8rem; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 12px 24px; background: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 500; color: #555; transition: all 0.2s; }
        .tab.active { background: #2c3e50; color: white; }
        .tab:hover:not(.active) { background: #e8e8e8; }
        .panel { display: none; background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .panel.active { display: block; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; color: #333; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
        input:focus, select:focus { outline: none; border-color: #2c3e50; box-shadow: 0 0 0 3px rgba(44,62,80,0.1); }
        .row { display: flex; gap: 16px; }
        .row .form-group { flex: 1; }
        .time-selector-row { display: flex; gap: 8px; }
        .time-selector-row select { flex: 1; min-width: 0; }
        button.primary { width: 100%; padding: 14px; background: #2c3e50; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        button.primary:hover { background: #1a252f; }
        .results { margin-top: 20px; }
        .room-list { list-style: none; }
        .room-item { padding: 12px 16px; background: #f8f9fa; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .room-name { font-weight: 500; font-size: 1.1rem; }
        .room-badge { background: #27ae60; color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; }
        .periods { display: flex; flex-direction: column; gap: 8px; }
        .period { padding: 12px 16px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .period.free { background: #e8f8f0; border-left: 4px solid #27ae60; }
        .period.occupied { background: #fdf0ed; border-left: 4px solid #e74c3c; }
        .period-time { font-weight: 500; color: #2c3e50; }
        .period-status { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
        .period.free .period-status { color: #27ae60; }
        .period.occupied .period-status { color: #e74c3c; }
        .schedule-item { padding: 16px; background: #f8f9fa; border-radius: 6px; margin-bottom: 12px; }
        .schedule-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .schedule-time { font-weight: 600; color: #2c3e50; }
        .schedule-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; font-size: 0.9rem; color: #555; }
        .schedule-details span { background: white; padding: 6px 10px; border-radius: 4px; }
        .empty { text-align: center; color: #888; padding: 40px; }
        .count { margin-top: 16px; color: #666; font-size: 0.9rem; }
        .error { background: #fee; color: #c00; padding: 12px; border-radius: 6px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Free Classroom Finder</h1>
            <p>Find available classrooms and view schedules</p>
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="find-free">Find Free Classrooms</button>
            <button class="tab" data-tab="room-free">When is a Room Free?</button>
            <button class="tab" data-tab="room-schedule">View Room Schedule</button>
        </div>

        <div id="find-free" class="panel active">
            <form id="free-form">
                <div class="row">
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="free-date" required>
                    </div>
                    <div class="form-group">
                        <label>Start Time</label>
                        <div class="time-selector-row">
                            <select id="free-start-hour" required>
                                <option value="">Hour</option>
                                <option value="12">12</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                            </select>
                            <select id="free-start-minute" required>
                                <option value="">Min</option>
                                <option value="00">00</option>
                                <option value="05">05</option>
                                <option value="10">10</option>
                                <option value="15">15</option>
                                <option value="20">20</option>
                                <option value="25">25</option>
                                <option value="30">30</option>
                                <option value="35">35</option>
                                <option value="40">40</option>
                                <option value="45">45</option>
                                <option value="50">50</option>
                                <option value="55">55</option>
                            </select>
                            <select id="free-start-ampm" required>
                                <option value="">AM/PM</option>
                                <option value="AM">AM</option>
                                <option value="PM">PM</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>End Time</label>
                        <div class="time-selector-row">
                            <select id="free-end-hour" required>
                                <option value="">Hour</option>
                                <option value="12">12</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                            </select>
                            <select id="free-end-minute" required>
                                <option value="">Min</option>
                                <option value="00">00</option>
                                <option value="05">05</option>
                                <option value="10">10</option>
                                <option value="15">15</option>
                                <option value="20">20</option>
                                <option value="25">25</option>
                                <option value="30">30</option>
                                <option value="35">35</option>
                                <option value="40">40</option>
                                <option value="45">45</option>
                                <option value="50">50</option>
                                <option value="55">55</option>
                            </select>
                            <select id="free-end-ampm" required>
                                <option value="">AM/PM</option>
                                <option value="AM">AM</option>
                                <option value="PM">PM</option>
                            </select>
                        </div>
                    </div>
                </div>
                <button type="submit" class="primary">Find Free Classrooms</button>
            </form>
            <div class="results" id="free-results"></div>
        </div>

        <div id="room-free" class="panel">
            <form id="room-free-form">
                <div class="row">
                    <div class="form-group">
                        <label>Classroom</label>
                        <select id="room-free-room" required>
                            <option value="">Select a classroom</option>
                            {% for room in classrooms %}
                            <option value="{{ room }}">{{ room }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="room-free-date" required>
                    </div>
                </div>
                <button type="submit" class="primary">Check Free Periods</button>
            </form>
            <div class="results" id="room-free-results"></div>
        </div>

        <div id="room-schedule" class="panel">
            <form id="room-schedule-form">
                <div class="row">
                    <div class="form-group">
                        <label>Classroom</label>
                        <select id="room-schedule-room" required>
                            <option value="">Select a classroom</option>
                            {% for room in classrooms %}
                            <option value="{{ room }}">{{ room }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="room-schedule-date" required>
                    </div>
                </div>
                <button type="submit" class="primary">View Schedule</button>
            </form>
            <div class="results" id="room-schedule-results"></div>
        </div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab');
        const panels = document.querySelectorAll('.panel');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        function formatDateForAPI(dateStr) {
            // Convert YYYY-MM-DD to DD-MM-YYYY
            const parts = dateStr.split('-');
            if (parts.length === 3 && parts[0].length === 4) {
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
            return dateStr; // Already in DD-MM-YYYY
        }

        function buildTimeString(hourId, minuteId, ampmId) {
            const hour = document.getElementById(hourId).value;
            const minute = document.getElementById(minuteId).value;
            const ampm = document.getElementById(ampmId).value;
            if (!hour || !minute || !ampm) return null;
            return `${hour.padStart(2, '0')}:${minute} ${ampm}`;
        }

        function timeToMinutes(timeStr) {
            if (!timeStr) return null;
            const match = timeStr.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
            if (!match) return null;
            let hour = parseInt(match[1], 10);
            const minute = parseInt(match[2], 10);
            const ampm = match[3].toUpperCase();
            if (ampm === 'PM' && hour !== 12) hour += 12;
            if (ampm === 'AM' && hour === 12) hour = 0;
            return hour * 60 + minute;
        }

        function validateTimeRange(startStr, endStr) {
            const startMin = timeToMinutes(startStr);
            const endMin = timeToMinutes(endStr);
            return startMin !== null && endMin !== null && endMin > startMin;
        }

        document.getElementById('free-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const date = formatDateForAPI(document.getElementById('free-date').value);
            const start = buildTimeString('free-start-hour', 'free-start-minute', 'free-start-ampm');
            const end = buildTimeString('free-end-hour', 'free-end-minute', 'free-end-ampm');
            const resultsDiv = document.getElementById('free-results');

            if (!start || !end) {
                resultsDiv.innerHTML = '<div class="error">Please select both start and end times completely.</div>';
                return;
            }
            if (!validateTimeRange(start, end)) {
                resultsDiv.innerHTML = '<div class="error">End time must be later than start time.</div>';
                return;
            }

            resultsDiv.innerHTML = '<div style="text-align:center;color:#666;">Loading...</div>';

            try {
                const res = await fetch('/api/free_rooms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date, start_time: start, end_time: end })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                renderFreeRooms(data, resultsDiv);
            } catch (err) {
                resultsDiv.innerHTML = `<div class="error">${err.message}</div>`;
            }
        });

        document.getElementById('room-free-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const room = document.getElementById('room-free-room').value;
            const date = formatDateForAPI(document.getElementById('room-free-date').value);
            const resultsDiv = document.getElementById('room-free-results');
            resultsDiv.innerHTML = '<div style="text-align:center;color:#666;">Loading...</div>';

            try {
                const res = await fetch('/api/room_periods', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room, date })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                renderPeriods(data, resultsDiv);
            } catch (err) {
                resultsDiv.innerHTML = `<div class="error">${err.message}</div>`;
            }
        });

        document.getElementById('room-schedule-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const room = document.getElementById('room-schedule-room').value;
            const date = formatDateForAPI(document.getElementById('room-schedule-date').value);
            const resultsDiv = document.getElementById('room-schedule-results');
            resultsDiv.innerHTML = '<div style="text-align:center;color:#666;">Loading...</div>';

            try {
                const res = await fetch('/api/room_schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room, date })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                renderSchedule(data, resultsDiv);
            } catch (err) {
                resultsDiv.innerHTML = `<div class="error">${err.message}</div>`;
            }
        });

        function renderFreeRooms(data, container) {
            if (!data.rooms.length) {
                container.innerHTML = '<div class="empty">No classrooms available for this time slot.</div>';
                return;
            }
            let html = `<h3>${data.rooms.length} classroom${data.rooms.length !== 1 ? 's' : ''} free on ${data.day} (${data.date})</h3>`;
            html += '<ul class="room-list">';
            data.rooms.forEach(room => {
                html += `<li class="room-item"><span class="room-name">${room}</span></li>`;
            });
            html += '</ul>';
            container.innerHTML = html;
        }

        function renderPeriods(data, container) {
            if (!data.periods.length) {
                container.innerHTML = '<div class="empty">No data available.</div>';
                return;
            }
            let html = `<h3>${data.room} — ${data.day}</h3>`;
            html += '<div class="periods">';
            data.periods.forEach(p => {
                html += `<div class="period ${p.status.toLowerCase()}">
                    <span class="period-time">${p.start} - ${p.end}</span>
                    <span class="period-status">${p.status}</span>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function renderSchedule(data, container) {
            if (!data.schedule.length) {
                container.innerHTML = '<div class="empty">No classes scheduled for this room on this day.</div>';
                return;
            }
            let html = `<h3>${data.room} — ${data.day}</h3>`;
            data.schedule.forEach(cls => {
                html += `<div class="schedule-item">
                    <div class="schedule-header">
                        <span class="schedule-time">${cls.start} - ${cls.end}</span>
                    </div>
                    <div class="schedule-details">
                        <span><strong>Course:</strong> ${cls.course}</span>
                        <span><strong>Semester:</strong> ${cls.semester}</span>
                        <span><strong>Section:</strong> ${cls.section}</span>
                        <span><strong>Subject:</strong> ${cls.subject}</span>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
